name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run check
      # tests that depend on the calendar (daylight saving, a day of 23 or 25 hours) run in zones that have it
      - run: TZ=Europe/Kiev npm test
      - run: TZ=Pacific/Auckland npm test
      - run: npm run types
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: eyetime-packages, path: dist/*.zip }
      - name: Lint the Firefox package (web-ext)
        run: mkdir /tmp/ff && unzip -q dist/eyetime-firefox.zip -d /tmp/ff && npx --yes web-ext lint -s /tmp/ff --warnings-as-errors=false
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest -v test_companion
        working-directory: companion
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright axe-core && npx playwright install --with-deps chromium
      - run: node scripts-dev/e2e/e2e.cjs
      - run: node scripts-dev/e2e/upgrade.cjs
      - run: node scripts-dev/e2e/a11y.cjs --strict
      - run: node scripts-dev/e2e/keyboard.cjs
      - run: node scripts-dev/e2e/blocking.cjs
      - run: node scripts-dev/e2e/calendar.cjs
      - run: node scripts-dev/e2e/storage.cjs
      - run: node scripts-dev/e2e/dock.cjs
      - run: node scripts-dev/e2e/editor.cjs
      - run: node scripts-dev/e2e/depth.cjs
      - run: node scripts-dev/e2e/cutout.cjs
      - run: node scripts-dev/e2e/layouts.cjs
      - run: node scripts-dev/e2e/settings.cjs
      - run: node scripts-dev/e2e/phototone.cjs
      - run: node scripts-dev/e2e/quotes.cjs
      - run: node scripts-dev/e2e/standby.cjs
      - run: node scripts-dev/e2e/stack.cjs
      - run: node scripts-dev/e2e/inspector.cjs
      - run: node scripts-dev/e2e/tasksync.cjs
      - run: node scripts-dev/e2e/perf.cjs
      # screenshots of the main screens against scripts-dev/e2e/visual-baseline (proved stable on CI fonts); after an intended UI change run `node scripts-dev/e2e/visual.cjs --update`
      - run: node scripts-dev/e2e/visual.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: visual-diff, path: /tmp/eyetime-visual-diff, if-no-files-found: ignore }
