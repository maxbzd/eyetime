name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: eyetime-extension, path: eyetime-extension.zip }
