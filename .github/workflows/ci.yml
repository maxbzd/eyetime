name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: eyetime-packages, path: dist/*.zip }
      - name: Lint the Firefox package (web-ext)
        run: mkdir /tmp/ff && unzip -q dist/eyetime-firefox.zip -d /tmp/ff && npx --yes web-ext lint -s /tmp/ff --warnings-as-errors=false
  companion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m unittest -v test_companion
        working-directory: companion
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright axe-core && npx playwright install --with-deps chromium
      - run: node scripts-dev/e2e/e2e.cjs
      - run: node scripts-dev/e2e/upgrade.cjs
      - run: node scripts-dev/e2e/a11y.cjs --strict
      - run: node scripts-dev/e2e/blocking.cjs
      - run: node scripts-dev/e2e/calendar.cjs
