name: CI
on:
  push:
    branches: [main, 'ccr-*']
  pull_request:
  workflow_dispatch: # run it by hand on any branch (gh workflow run ci.yml --ref <branch>)
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, cache: npm } # the npm download cache (keyed by package-lock.json): the same packages are not fetched again by every job
      # the exact versions of the tools are in package-lock.json; `npm ci` fails if it and package.json disagree
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run lint
      - run: npm run types
      - run: npm run coverage
      # tests that depend on the calendar (daylight saving, a day of 23 or 25 hours) run in zones that have it
      - run: TZ=Europe/Kiev npm test
      - run: TZ=Pacific/Auckland npm test
      - run: npm run build
      # where the translations look wrong (hints for a human, never a failure)
      - run: node scripts-dev/i18n-report.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with: { name: eyetime-packages, path: dist/*.zip }
      - name: Lint the Firefox package (web-ext)
        run: mkdir /tmp/ff && unzip -q dist/eyetime-firefox.zip -d /tmp/ff && npx --yes web-ext@10.8.0 lint -s /tmp/ff --warnings-as-errors=false
  # The package that is shipped (bundled and minified), not the source: loaded into Chromium and used. A bundler can break things the source tree does not show
  # (a path taken from import.meta.url, a module that is loaded by name): this is where that shows.
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, cache: npm } # the npm download cache (keyed by package-lock.json): the same packages are not fetched again by every job
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts-dev/verify-build.mjs
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - run: EXT=$PWD/dist/chrome node scripts-dev/e2e/dist.cjs
      # the two features that need a real browser against a real server or cloud, on the package that is uploaded to the store (not the source tree)
      - run: EXT=$PWD/dist/chrome node scripts-dev/e2e/instant.cjs
      - run: EXT=$PWD/dist/chrome node scripts-dev/e2e/syncenc.cjs
  companion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: python -m unittest -v test_companion
        working-directory: companion
  # The end-to-end suites are listed in scripts-dev/e2e/suites.json and split into balanced shards by run.mjs (two browsers at a time per machine).
  # A suite that fails once and passes on the retry is reported as a warning (a flaky test) and does not fail the build.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    name: e2e (${{ matrix.shard }}/5)
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24, cache: npm } # the npm download cache (keyed by package-lock.json): the same packages are not fetched again by every job
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1
      - run: npm i --no-save playwright@1.56.1 axe-core@4.14.0 && npx playwright install --with-deps chromium
      # screenshots of the main screens against scripts-dev/e2e/visual-baseline (CI fonts); after an intended UI change run the suites once, download the `visual-diff-*` artifacts and copy the `*-now.png` files over the baseline
      - run: node scripts-dev/e2e/run.mjs --shard ${{ matrix.shard }}/5 --jobs 2 --retries 1
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: visual-diff-${{ matrix.shard }}
          path: /tmp/eyetime-visual-diff
          if-no-files-found: ignore
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: failure()
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: /tmp/eyetime-e2e
          if-no-files-found: ignore
  # one stable name to require in the branch rules, whatever the number of shards
  e2e-ok:
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "${{ needs.e2e.result }}" = success
