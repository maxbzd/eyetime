name: Desktop release
# Builds the installer on Windows, tries it for real, signs it and publishes it as a release "desktop-v<version>".
# Two signatures, in this order: Authenticode of the programs and the installer (the secrets WINDOWS_CERT_PFX_BASE64 and WINDOWS_CERT_PASSWORD; without them a warning),
# then the update signature over the finished file (UPDATE_SIGNING_KEY), so that it covers exactly the file people download.
# Start it with the button "Run workflow" (Actions -> Desktop release), or by pushing a tag like desktop-v0.2.0.
# The version is the one in desktop/Cargo.toml, and the notes are its section in desktop/CHANGELOG.md.
# The installed apps find the release by themselves (they look at this repository's releases) and offer the update.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: write

defaults:
  run:
    working-directory: desktop

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Which version, and is it free
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag") {
            $tag = "${{ github.ref_name }}".Replace('desktop-v', '')
            if ($tag -ne $ver) { throw "The tag says $tag but Cargo.toml says $ver. Change the version first." }
          }
          gh release view "desktop-v$ver" 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "The release desktop-v$ver already exists. Raise the version in desktop/Cargo.toml (and add its section to desktop/CHANGELOG.md)." }
          $global:LASTEXITCODE = 0
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $ver = $env:VER
          $lines = Get-Content CHANGELOG.md
          $out = @(); $on = $false
          foreach ($l in $lines) {
            if ($l -match '^## ') { if ($on) { break }; if ($l -match [regex]::Escape($ver)) { $on = $true; continue } }
            elseif ($on) { $out += $l }
          }
          if (-not ($out | Where-Object { $_ -match '^\s*[-*] ' })) { throw "CHANGELOG.md has no '## $ver' section with '- ' points." }
          $out | Set-Content notes.md
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: desktop }
      - run: cargo test --locked -p eyetime-core -p eyetime-helper
      - name: Build the helper and the window
        run: cargo build --locked --release -p eyetime-helper -p eyetime
      - name: Gather the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item target/release/eyetime.exe payload/eyetime.exe
          Copy-Item target/release/eyetime-helper.exe payload/eyetime-helper.exe
      - name: Sign the programs inside (Authenticode, when the certificate is set up)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ../.github/scripts/sign-windows.ps1 payload/eyetime.exe payload/eyetime-helper.exe
      - name: Build the installer (with the files inside)
        shell: pwsh
        run: |
          $env:EYETIME_PAYLOAD = (Resolve-Path payload).Path
          cargo build --locked --release -p eyetime-setup
          Copy-Item target/release/eyetime-setup.exe EyeTime-Setup.exe
      - name: Sign the installer (Authenticode, when the certificate is set up)
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: ../.github/scripts/sign-windows.ps1 EyeTime-Setup.exe
      - name: Try it for real (install, service, hosts file, window, uninstall)
        shell: pwsh
        run: ./tests/smoke.ps1 -Setup (Resolve-Path EyeTime-Setup.exe).Path -Out smoke-out
      - name: Sign the installer (the apps run an update only if this key signed it)
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if (-not $env:UPDATE_SIGNING_KEY) {
            Write-Host "::warning::The secret UPDATE_SIGNING_KEY is not set, so this build is NOT signed. Apps of version 0.2 and later will ignore an unsigned update (install it by hand); add the secret before the next release."
            "" | Add-Content notes.md
            "> Not signed yet: the release key was not set up when this was built. EyeTime 0.2 and later only run signed updates, so install this one by hand." | Add-Content notes.md
            "unsigned" | Out-File signed.txt
            exit 0
          }
          cargo run --release -p eyetime-core --bin eyetime-sign -- $env:VER EyeTime-Setup.exe | Set-Content -NoNewline -Encoding ascii EyeTime-Setup.exe.sig
          if ((Get-Content EyeTime-Setup.exe.sig -Raw).Trim().Length -ne 128) { throw "The signature was not made." }
      - name: winget manifests (made, checked by winget itself, attached to the release for submission to winget-pkgs)
        shell: pwsh
        run: |
          $sha = (Get-FileHash EyeTime-Setup.exe -Algorithm SHA256).Hash
          node packaging/winget/make.mjs $env:VER $sha winget-out
          winget validate --manifest "winget-out/manifests/m/maxbzd/EyeTime/$env:VER"
          if ($LASTEXITCODE -ne 0) { throw "winget does not accept the manifests." }
          Compress-Archive -Path "winget-out/manifests" -DestinationPath winget-manifests.zip
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("EyeTime-Setup.exe", "winget-manifests.zip")
          if (Test-Path EyeTime-Setup.exe.sig) { $files += "EyeTime-Setup.exe.sig" }
          gh release create "desktop-v$env:VER" @files --target "${{ github.sha }}" --title "EyeTime for Windows $env:VER" --notes-file notes.md
