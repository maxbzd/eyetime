# Sets the usage collector up on the owner's Cloudflare account, from the browser: Actions → "Set up the collector" → Run workflow.
# Needs three repository secrets (Settings → Secrets and variables → Actions): CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DASH_TOKEN. See server/usage/README.md.
# It only runs when started by hand, can be run again, and prints no secret.
name: Set up the collector
on: workflow_dispatch
permissions:
  contents: read
concurrency: collector
jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 24 }
      - name: Check the secrets
        env: { A: "${{ secrets.CLOUDFLARE_API_TOKEN }}", B: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", C: "${{ secrets.DASH_TOKEN }}" }
        run: |
          for v in A B C; do [ -n "${!v}" ] || { echo "::error::A repository secret is missing: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DASH_TOKEN are all needed (Settings → Secrets and variables → Actions)."; exit 1; }; done
      - name: Create the database, the tables and the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DASH_TOKEN: ${{ secrets.DASH_TOKEN }}
        run: node server/usage/setup.mjs | tee setup.log
      - name: Show the address
        run: |
          { echo '### The collector is up'; grep -E 'endpoint|Dashboard:' setup.log | sed 's/^/    /'; echo; echo 'Give Claude the *endpoint* line only. The dashboard key is the DASH_TOKEN secret you saved.'; } >> "$GITHUB_STEP_SUMMARY"
