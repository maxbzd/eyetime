name: Desktop
on:
  push:
    branches: [main, 'ccr-*']
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: desktop

jobs:
  # The logic (rules, hosts file, challenges, tamper guards, the helper against a pretend computer) and the screens against it.
  logic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # the compiler named in desktop/rust-toolchain.toml (not "whatever is stable today")
      - run: rustup toolchain install && rustup target add x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: desktop }
      - run: cargo fmt --all --check
      - name: Clippy (a warning is an error), for this machine and for Windows
        run: |
          cargo clippy --locked -p eyetime-core -p eyetime-helper --all-targets -- -D warnings
          cargo clippy --locked -p eyetime-helper --all-targets --target x86_64-pc-windows-gnu -- -D warnings
          cargo clippy --locked -p eyetime-setup --target x86_64-pc-windows-gnu -- -D warnings   # the installer runs as an administrator: it is linted like the rest
      - run: cargo test --locked -p eyetime-core -p eyetime-helper
      - name: The Windows code compiles (checked, not run)
        run: cargo check --locked -p eyetime-helper -p eyetime-setup --target x86_64-pc-windows-gnu
      - name: Dependencies (known vulnerabilities, licences, sources)
        run: |
          cargo install --locked cargo-deny@0.20.2
          cargo deny --locked check
      - name: The screens against the real logic
        run: |
          cargo build -p eyetime-helper --bin eyetime-sim
          (./target/debug/eyetime-sim prototype 8131 &)
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/8131) 2>/dev/null && break; sleep 0.2; done  # until it answers, not a guess of one second
          npm i --no-save playwright@1.56.1 axe-core@4.14.0 && npx playwright install --with-deps chromium
          node tests/e2e_real.cjs
          node tests/xss_real.cjs
          node tests/a11y_real.cjs
      - name: The browser extension (its rules, then in a real Chromium through a native host)
        run: |
          node --test tests/extension_rules.test.mjs
          pkill -f eyetime-sim || true
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/8131) 2>/dev/null || break; sleep 0.2; done   # the old one has let go of the port
          (./target/debug/eyetime-sim prototype 8131 &)
          for i in $(seq 1 50); do (echo > /dev/tcp/127.0.0.1/8131) 2>/dev/null && break; sleep 0.2; done  # and the new one answers
          node tests/ext_e2e.cjs

  # The real thing, built on Windows: the helper (service), the window (Tauri), and the installer with both inside.
  windows:
    runs-on: windows-latest
    needs: logic
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { workspaces: desktop }
      - name: Build the helper and the window
        run: cargo build --locked --release -p eyetime-helper -p eyetime
      - name: Gather the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item target/release/eyetime.exe payload/eyetime.exe
          Copy-Item target/release/eyetime-helper.exe payload/eyetime-helper.exe
      - name: Build the installer (with the files inside)
        shell: pwsh
        run: |
          $env:EYETIME_PAYLOAD = (Resolve-Path payload).Path
          cargo build --release -p eyetime-setup
          Copy-Item target/release/eyetime-setup.exe EyeTime-Setup.exe
      - name: Try it for real (install, service, hosts file, window, uninstall)
        shell: pwsh
        run: ./tests/smoke.ps1 -Setup (Resolve-Path EyeTime-Setup.exe).Path -Out smoke-out
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: eyetime-smoke
          path: desktop/smoke-out
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: eyetime-windows
          path: |
            desktop/EyeTime-Setup.exe
          # The installer is not signed yet: Windows SmartScreen will warn about an unknown publisher.
