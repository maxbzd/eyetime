name: Finish relicensing (one-off)
# Started by hand, once: Actions → "Finish relicensing (one-off)" → Run workflow → type  relicense
# The history of the repository was rewritten so that every commit carries the Functional Source License. What a person cannot do from a session is done here, by the
# repository's own token: the tags are moved to the rewritten commits, the branches of the bot (which still hold old commits) are deleted, and the files of the old
# releases get the FSL LICENSE/NOTICE. Safe to run again. After it, this file and scripts-dev/relicense/ are removed.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type  relicense  to move the tags, delete the bot branches and patch the old release files'
        required: true
permissions:
  contents: write
jobs:
  finish:
    if: ${{ inputs.confirm == 'relicense' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - name: Move the tags to the rewritten commits
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          while read -r tag sha; do
            git cat-file -e "$sha^{commit}" || { echo "::error::commit $sha for tag $tag is missing"; exit 1; }
            git push --force origin "$sha:refs/tags/$tag"
          done < scripts-dev/relicense/tags.txt
      - name: Delete the branches of the bot (they hold old commits)
        run: |
          for b in $(git ls-remote --heads origin 'dependabot/*' | awk '{print $2}' | sed 's#refs/heads/##'); do git push origin --delete "$b" || true; done
      - name: Put the licence into the files of the old releases
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mkdir -p work
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^v'); do
            echo "== $tag"
            for a in $(gh release view "$tag" --json assets --jq '.assets[].name' | grep -E '\.(zip|json)$'); do
              gh release download "$tag" --pattern "$a" --dir work --clobber
              python3 scripts-dev/relicense/patch_zip.py "work/$a"
              gh release upload "$tag" "work/$a" --clobber
              rm -f "work/$a"
            done
          done
      - name: Check
        run: |
          git fetch --tags --force origin
          bad=0
          for t in $(git tag); do l=$(git show "$t:LICENSE" | head -1); [ "$l" = "# Functional Source License, Version 1.1, ALv2 Future License" ] || { echo "::error::tag $t still has: $l"; bad=1; }; done
          echo "dependabot branches left: $(git ls-remote --heads origin 'dependabot/*' | wc -l)"
          exit $bad
