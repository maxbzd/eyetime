name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check
      - run: npm run build
      - run: gh release create "$GITHUB_REF_NAME" dist/eyetime-chrome.zip dist/eyetime-firefox.zip --generate-notes
        env: { GH_TOKEN: '${{ github.token }}' }
