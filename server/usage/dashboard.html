<head>

<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d67; --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,.10);
  --s1: #2a78d6; --s2: #eb6834; --seq-lo: #e6f0fc; --seq-hi: #184f95; --on-seq: #fff; --soft: #eaf2fd; --soft-ink: #184f95;
  --good: #006300; --warn-bg: #fff3d6; --warn-ink: #6b4a00; --bad: #d03b3b; --bad-bg: #fde8e8; --bad-ink: #8f1f1f; --shadow: 0 1px 2px rgba(11,11,11,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
    --s1: #3987e5; --s2: #d95926; --seq-lo: #1f2a3a; --seq-hi: #3987e5; --on-seq: #fff; --soft: #1d2a3d; --soft-ink: #9ec5f4;
    --good: #0ca30c; --warn-bg: #3a2e0c; --warn-ink: #fab219; --bad: #ec6a6a; --bad-bg: #3a1a1a; --bad-ink: #f2a0a0; --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e97; --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,.10);
  --s1: #3987e5; --s2: #d95926; --seq-lo: #1f2a3a; --seq-hi: #3987e5; --on-seq: #fff; --soft: #1d2a3d; --soft-ink: #9ec5f4;
  --good: #0ca30c; --warn-bg: #3a2e0c; --warn-ink: #fab219; --bad: #ec6a6a; --bad-bg: #3a1a1a; --bad-ink: #f2a0a0; --shadow: none;
}
* { box-sizing: border-box; }
html { background: var(--page); }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px 64px; }

/* top bar */
header.top { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--page) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--grid); }
.top .in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-weight: 650; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--s1); display: inline-block; }
.fresh { color: var(--ink2); font-size: 13px; }
.sp { flex: 1; }
.btn { background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 5px 10px; font-size: 13px; color: var(--ink2); }
.btn:hover { color: var(--ink); border-color: var(--axis); }
nav.toc { max-width: 1120px; margin: 0 auto; padding: 0 16px 8px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.toc a { color: var(--ink2); text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
nav.toc a:hover { background: var(--soft); color: var(--soft-ink); }

/* generic */
h1 { font-size: 26px; letter-spacing: -.02em; margin: 28px 0 4px; }
h2 { font-size: 19px; letter-spacing: -.01em; margin: 0; }
h3 { font-size: 13px; font-weight: 600; text-transform: none; color: var(--ink2); margin: 0 0 8px; }
p { margin: 0; }
.lead { color: var(--ink2); max-width: 70ch; }
section { margin-top: 40px; scroll-margin-top: 90px; }
.sechead { margin-bottom: 14px; }
.sechead .q { color: var(--ink2); font-size: 14px; margin-top: 2px; max-width: 78ch; }
.sechead .act { font-size: 13px; color: var(--muted); margin-top: 2px; }
.sechead .act b { color: var(--ink2); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 14px; padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.grid { display: grid; gap: 12px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.note { font-size: 12.5px; color: var(--muted); margin-top: 10px; max-width: 80ch; }
.tag { display: inline-block; font-size: 11.5px; line-height: 1; padding: 3px 7px; border-radius: 999px; background: var(--soft); color: var(--soft-ink); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn-ink); }
.tag.bad { background: var(--bad-bg); color: var(--bad-ink); }
.tag.dim { background: transparent; border: 1px dashed var(--axis); color: var(--muted); }

/* banners */
.banner { margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; }
.banner.warn { background: var(--warn-bg); color: var(--warn-ink); }
.banner.info { background: var(--soft); color: var(--soft-ink); }
.banner b { font-weight: 650; }

/* KPI */
.kpi { display: flex; flex-direction: column; gap: 2px; }
.kpi .lab { font-size: 13px; color: var(--ink2); }
.kpi .val { font-size: 34px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; }
.kpi .sub { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.kpi.low .val { color: var(--muted); }
.kpi .bar { height: 6px; background: var(--grid); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.kpi .bar i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }
.kpi.low .bar i { background: repeating-linear-gradient(45deg, var(--axis) 0 4px, transparent 4px 7px); }

/* insights */
.insights { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.insights li { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--ring); font-size: 14px; }
.insights .ic { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
.ic.good { background: var(--soft); color: var(--good); }
.ic.warn { background: var(--warn-bg); color: var(--warn-ink); }
.ic.info { background: var(--soft); color: var(--soft-ink); }

/* horizontal bars */
.hlist { display: grid; gap: 4px; }
.hrow { display: grid; grid-template-columns: minmax(110px, 36%) 1fr 132px; gap: 10px; align-items: center; padding: 4px 6px; margin: 0 -6px; border-radius: 8px; min-height: 30px; }
.hrow:hover, .hrow:focus-visible { background: var(--soft); }
.hrow .nm { font-size: 13.5px; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hrow .tr { height: 10px; background: var(--grid); border-radius: 0 5px 5px 0; position: relative; }
.hrow .tr i { position: absolute; inset: 0 auto 0 0; background: var(--s1); border-radius: 0 4px 4px 0; min-width: 2px; }
.hrow .vl { font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.hrow .vl small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.hrow.low .tr i { background: repeating-linear-gradient(45deg, var(--axis) 0 4px, color-mix(in srgb, var(--axis) 40%, transparent) 4px 7px); }
.hrow.cut .tr i { background: var(--s2); }
.hrow.step .tr i { background: var(--s1); }
.fhead { display: grid; grid-template-columns: minmax(110px, 36%) 1fr 132px; gap: 10px; font-size: 12px; color: var(--muted); padding: 0 0 4px; border-bottom: 1px solid var(--grid); margin-bottom: 4px; }
.fhead span:last-child { text-align: right; }
.conv { color: var(--muted); font-size: 12px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--ring); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; color: var(--ink2); }
.chip[aria-pressed="true"] { background: var(--soft); color: var(--soft-ink); border-color: transparent; font-weight: 600; }

/* svg charts */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 11.5px system-ui, -apple-system, "Segoe UI", sans-serif; }
svg.chart .grid line { stroke: var(--grid); stroke-width: 1; }
svg.chart .axis { stroke: var(--axis); stroke-width: 1; }
svg.chart .bar { fill: var(--s1); }
svg.chart .bar.part { fill: color-mix(in srgb, var(--s1) 45%, var(--surface)); }
svg.chart .hit { fill: transparent; }
svg.chart .hit:hover + .bar, svg.chart g.col:focus-within .bar, svg.chart g.col:hover .bar { filter: brightness(1.12); }
svg.chart .cross { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
svg.chart g.col:hover .cross, svg.chart g.col:focus-within .cross { opacity: .7; }
svg.chart .val { fill: var(--ink2); font-weight: 600; }
svg.chart .med { stroke: var(--ink2); stroke-width: 1.5; stroke-dasharray: 4 3; }

/* heatmap */
.heat { overflow-x: auto; }
table.hm { border-collapse: separate; border-spacing: 2px; font-size: 12.5px; min-width: 560px; width: 100%; }
table.hm th { font-weight: 500; color: var(--muted); text-align: center; padding: 2px 4px; white-space: nowrap; }
table.hm th.rw { text-align: left; color: var(--ink2); padding-right: 10px; }
table.hm th.rw small { color: var(--muted); }
table.hm td { height: 30px; text-align: center; border-radius: 5px; font-variant-numeric: tabular-nums; min-width: 44px; background: var(--grid); color: var(--muted); }
table.hm td.c { background: color-mix(in srgb, var(--seq-hi) calc(var(--p) * 100%), var(--seq-lo)); color: var(--ink); }
table.hm td.c.hi { color: var(--on-seq); }
table.hm td.c.low { opacity: .5; }
table.hm td.empty { background: transparent; }
table.hm td:focus-visible { outline-offset: 0; }

/* details with the data as a table */
details.data { margin-top: 12px; font-size: 13px; }
details.data summary { cursor: pointer; color: var(--ink2); width: max-content; }
details.data table { border-collapse: collapse; margin-top: 8px; width: 100%; font-variant-numeric: tabular-nums; }
details.data th, details.data td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
details.data th { color: var(--muted); font-weight: 500; }
details.data td:not(:first-child), details.data th:not(:first-child) { text-align: right; }
details.data .scroll { overflow-x: auto; }

/* the period bar, the comparison, the export menu */
.bar2 { margin-top: 16px; display: grid; gap: 10px; }
.bar2 .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 2px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 5px 12px; font-size: 13.5px; color: var(--ink2); }
.seg button:hover { background: var(--soft); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--soft-ink); font-weight: 650; }
.custom { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--ink2); }
.custom input[type=date] { background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 5px 8px; color-scheme: inherit; }
.custom .btn.primary, .btn.primary { background: var(--s1); color: #fff; border-color: transparent; }
.rangetxt { font-size: 13px; color: var(--ink2); }
.rangetxt b { color: var(--ink); font-weight: 600; }
.switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; color: var(--ink2); cursor: pointer; }
.switch input { accent-color: var(--s1); width: 16px; height: 16px; }
details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 8; min-width: 250px; background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.18); display: grid; gap: 2px; }
details.menu .pop button { text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; font-size: 13.5px; display: grid; gap: 1px; }
details.menu .pop button:hover, details.menu .pop button:focus-visible { background: var(--soft); }
details.menu .pop small { color: var(--muted); font-size: 12px; }
.dl { font-size: 12.5px; margin-top: 2px; font-variant-numeric: tabular-nums; color: var(--muted); }
.dl.up { color: var(--good); } .dl.down { color: var(--bad-ink); }
.dl.flat { color: var(--muted); }
.scope { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 8px; padding: 2px 8px; border: 1px solid var(--grid); border-radius: 999px; vertical-align: middle; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--page); padding: 8px 14px; border-radius: 10px; font-size: 13px; z-index: 30; }

/* tooltip */
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--page); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; max-width: 280px; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
#tip .t { font-weight: 650; display: block; font-size: 13.5px; font-variant-numeric: tabular-nums; }
#tip .r { display: block; opacity: .85; }

/* gate and states */
.gate { max-width: 420px; margin: 18vh auto 0; padding: 24px; }
.gate h1 { margin-top: 0; font-size: 22px; }
.gate form { display: flex; gap: 8px; margin-top: 16px; }
.gate input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--axis); border-radius: 8px; padding: 8px 10px; }
.gate .btn.primary { background: var(--s1); color: #fff; border-color: transparent; }
.err { color: var(--bad-ink); background: var(--bad-bg); padding: 8px 10px; border-radius: 8px; margin-top: 12px; font-size: 13.5px; }
.loading #app { opacity: .55; transition: opacity .15s; }
footer.foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--grid); color: var(--muted); font-size: 12.5px; display: grid; gap: 6px; max-width: 80ch; }

@media (max-width: 560px) {
  .hrow { grid-template-columns: 1fr auto; }
  .hrow .tr { grid-column: 1 / -1; order: 3; }
  .fhead { display: none; }
  h1 { font-size: 22px; }
  .kpi .val { font-size: 30px; }
}
@media (forced-colors: active) { .hrow .tr i, svg.chart .bar { forced-color-adjust: none; } }
@media print { header.top, nav.toc, .chips, .btn, .bar2 .seg, .bar2 .custom, .switch, details.menu, details.data, #tip, .toast { display: none !important; } body { background: #fff; } section, .card { break-inside: avoid; } .hrow:hover { background: none; } }
</style>
</head>

/** Every figure on the page as rows: [section, id, metric, label, value, k, n]. Rates are ratios (0..1); the labels are in the language of the page. */

const csvCell = (v) => { let x = v == null ? '' : String(v); if (typeof v === 'string' && /^[=+\-@\t\r]/.test(x)) x = "'" + x; return /[",\r\n;]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; };
function exportCsv() { if (!state.s) return; download(`eyetime-${stamp()}.csv`, '﻿' + [t('csv_cols'), ...exportRows(state.s)].map((r) => r.map(csvCell).join(',')).join('\r\n') + '\r\n', 'text/csv;charset=utf-8'); }
function exportJson() { if (!state.s) return; download(`eyetime-${stamp()}.json`, JSON.stringify({ exported_at: new Date().toISOString(), mode: state.mode, ...state.s }, null, 2) + '\n', 'application/json'); }
function reportText(s) {
  const o = s.overview || {}, L2 = [], row = (...c) => '| ' + c.join(' | ') + ' |', P = (p) => (p && p.n ? `${pct(p.pct)} (${num(p.k)}/${num(p.n)})` : '—');

  L2.push(`**${t('rp_gen')}:** ${new Date().toISOString().slice(0, 16).replace('T', ' ')} UTC`, '', '_' + t('rp_sample') + '_', '');
  L2.push('## ' + t('rp_glance'), '');

  L2.push(`- ${t('k_recent')}: **${num(o.recent)}**`); if (o.new_in_range != null) L2.push(`- ${t('k_newp')}: **${num(o.new_in_range)}**`);

  if (s.funnel) L2.push('', '## ' + t('rp_funnel'), '', row(t('s_funnel'), t('n_inst'), '%'), row('---', '---:', '---:'), ...s.funnel.map((f) => row(t('f_' + f.id), num(f.n), pct(f.n / (s.funnel[0].n || 1)))));
  if (s.features) L2.push('', '## ' + t('rp_feat'), '', row(t('fh_name'), t('fh_users', { w: s.window_days }), t('fh_uses')), row('---', '---:', '---:'), ...s.features.slice(0, 10).map((f) => row(t('fn.' + f.id), P(f.users), f.uses != null ? num(f.uses) : '—')));

function syncUrl() {
  const q = new URLSearchParams(); for (const k of ['demo', 'public']) if (params.has(k)) q.set(k, '');
  const r = state.range; if (state.mode !== 'public') { if (r.kind === 'all') q.set('range', 'all'); else if (r.kind === 'custom') { q.set('from', r.from); q.set('to', r.to); } else if (r.kind !== String(DEFAULT_DAYS)) q.set('days', r.kind); }
  const qs = q.toString().replace(/(demo|public)=(&|$)/g, '$1$2');

}
let busy = false;
async function load() {
  if (busy) return; busy = true; document.body.classList.add('loading'); state.err = '';
  const token = tab.get('et-token') || '';
  const path = state.mode === 'demo' ? '/v1/demo-stats' : state.mode === 'public' ? '/v1/public-stats' : '/v1/stats';
  try {
    if (state.mode === 'owner' && !token) { state.s = null; return; }
    const r = await fetch(path + (state.mode === 'public' ? '' : '?' + periodQuery()), { headers: state.mode === 'owner' ? { authorization: 'Bearer ' + token } : {}, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' });
    if (r.status === 401) { tab.set('et-token', null); state.s = null; state.err = t('e401'); }
    else if (r.status === 404) { state.s = null; state.err = state.mode === 'demo' ? t('e_demo') : t('e404'); }

    else { state.s = await r.json(); state.rangeErr = ''; syncUrl(); }
  } catch { state.s = state.s || null; state.err = t('enet'); }
  finally { busy = false; state.first = false; document.body.classList.remove('loading'); render(); if (state.err && state.s) $('#fresh').textContent = state.err; }
}
