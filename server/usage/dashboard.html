<!-- The owner's dashboard: one file, no libraries, no requests except to its own origin (GET /v1/stats with the secret, or /v1/public-stats, or /v1/demo-stats with ?demo).
     Every number comes from stats.js; this page only draws them. Text from the server is put in with textContent, never as HTML. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>EyeTime — панель</title>
<style>
:root {
  color-scheme: light;
  /* the look: Linear's calm shell and Attio's plain reports. A grey frame (sidebar), one white panel, hairlines instead of shadows, 13px type, one blue. */
  --bg: #f4f4f5; --panel: #ffffff; --surface: #ffffff; --sunken: #f7f7f8; --line: #e8e8eb; --line2: #d9d9de;
  --ink: #1c1d20; --ink2: #5d6169; --muted: #8b8f98; --hover: rgba(20,20,30,.05); --sel: rgba(20,20,30,.075);
  --accent: #3a63e0; --accent-ink: #ffffff; --soft: #edf1fe; --soft-ink: #2547b8;
  --s1: #3a63e0; --s2: #e5703a; --s3: #2aa377; --s4: #d9a21b;
  --seq-lo: #eef2ff; --seq-hi: #2f55d4; --on-seq: #fff;
  --good: #1f8a4c; --good-bg: #e6f4ec; --warn: #a15c00; --warn-bg: #fcf0d9; --bad: #c0352b; --bad-bg: #fcebe9;
  --radius: 8px; --font: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0c0d; --panel: #131416; --surface: #131416; --sunken: #191a1d; --line: #232427; --line2: #31333a;
    --ink: #ecedee; --ink2: #9ca0a8; --muted: #6f737c; --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.085);
    --accent: #6f87ff; --accent-ink: #0b0c0d; --soft: rgba(111,135,255,.14); --soft-ink: #a9b8ff;
    --s1: #6f87ff; --s2: #f08a54; --s3: #3dbd8f; --s4: #e0b040; --seq-lo: #1a2040; --seq-hi: #6f87ff; --on-seq: #0b0c0d;
    --good: #4cc38a; --good-bg: rgba(76,195,138,.14); --warn: #f0b34a; --warn-bg: rgba(240,179,74,.14); --bad: #f27b72; --bad-bg: rgba(242,123,114,.14);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0c0d; --panel: #131416; --surface: #131416; --sunken: #191a1d; --line: #232427; --line2: #31333a;
  --ink: #ecedee; --ink2: #9ca0a8; --muted: #6f737c; --hover: rgba(255,255,255,.05); --sel: rgba(255,255,255,.085);
  --accent: #6f87ff; --accent-ink: #0b0c0d; --soft: rgba(111,135,255,.14); --soft-ink: #a9b8ff;
  --s1: #6f87ff; --s2: #f08a54; --s3: #3dbd8f; --s4: #e0b040; --seq-lo: #1a2040; --seq-hi: #6f87ff; --on-seq: #0b0c0d;
  --good: #4cc38a; --good-bg: rgba(76,195,138,.14); --warn: #f0b34a; --warn-bg: rgba(240,179,74,.14); --bad: #f27b72; --bad-bg: rgba(242,123,114,.14);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 13px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
p { margin: 0; }

/* the frame: a sidebar on the grey, and one white panel */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.side { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "ws foot" "nav nav"; align-items: center; gap: 0 8px; padding: 8px 12px 0; position: sticky; top: 0; z-index: 7; background: var(--bg); }
.ws { grid-area: ws; display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px; padding: 4px 0; min-width: 0; }
.ws span:first-of-type { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws .tag { margin-left: auto; }
.logo { width: 18px; height: 18px; border-radius: 5px; background: var(--accent); display: inline-block; flex: none; position: relative; }
.logo::after { content: ""; position: absolute; inset: 5px; border-radius: 50%; background: var(--accent-ink); opacity: .92; }
.sidefoot { grid-area: foot; display: flex; gap: 6px; align-items: center; }
.sidefoot .fresh { display: none; }
.tools { display: flex; gap: 2px; flex-wrap: wrap; }
nav.pages { grid-area: nav; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 6px 0 8px; }
nav.pages a { color: var(--ink2); text-decoration: none; padding: 5px 9px; border-radius: 6px; white-space: nowrap; display: flex; gap: 8px; align-items: center; height: 28px; }
nav.pages a:hover { background: var(--hover); color: var(--ink); }
nav.pages a[aria-current="page"] { background: var(--sel); color: var(--ink); font-weight: 550; }
nav.pages .ic { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }
nav.pages .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-left: auto; }
nav.pages .dot.bad { background: var(--bad); }
nav.pages .grp, nav.pages kbd { display: none; }
.panel { background: var(--panel); min-width: 0; }
.topbar { z-index: 6; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); min-height: 44px; }
.crumb { display: flex; align-items: center; gap: 6px; color: var(--ink2); white-space: nowrap; }
.crumb b { color: var(--ink); font-weight: 550; }
.crumb i { color: var(--muted); font-style: normal; }
.ctl .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
.content { padding: 8px 16px 64px; max-width: 1180px; margin: 0 auto; }
@media (min-width: 960px) {
  .app { grid-template-columns: 224px minmax(0, 1fr); height: 100vh; }
  .side { display: flex; flex-direction: column; align-items: stretch; align-content: stretch; gap: 0; padding: 10px 10px 8px; position: static; height: 100vh; overflow-y: auto; }
  .ws { padding: 4px 8px 10px; }
  nav.pages { flex-direction: column; overflow: visible; padding: 0; flex: 1; }
  nav.pages a { padding: 5px 8px; }
  nav.pages .grp { display: block; font-size: 11.5px; color: var(--muted); padding: 14px 8px 4px; font-weight: 500; }
  nav.pages kbd { display: inline; margin-left: auto; font: 11px var(--font); color: var(--muted); padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--sunken); opacity: 0; }
  nav.pages a:hover kbd { opacity: 1; }
  nav.pages a:has(.dot) kbd { margin-left: 6px; }
  nav.pages .dot { margin-left: auto; }
  .sidefoot { flex-direction: column; align-items: stretch; gap: 6px; padding: 8px 4px 0; }
  .sidefoot .fresh { display: block; color: var(--muted); font-size: 12px; padding: 0 4px; }
  .panel { margin: 8px 8px 8px 0; border: 1px solid var(--line); border-radius: 10px; height: calc(100vh - 16px); overflow-y: auto; overflow-x: hidden; }
  .topbar { position: sticky; top: 0; border-radius: 10px 10px 0 0; }
  .content { padding: 12px 28px 72px; }
}

/* buttons, tabs, menus */
.btn { background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 0 10px; height: 28px; font-size: 12.5px; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 550; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink2); padding: 0 8px; }
.btn.ghost:hover { background: var(--hover); color: var(--ink); }
.seg { display: inline-flex; background: var(--sunken); border: 1px solid var(--line); border-radius: 7px; padding: 2px; gap: 1px; }
.seg button { border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 0 9px; height: 22px; font-size: 12.5px; color: var(--ink2); white-space: nowrap; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); border-color: var(--line2); font-weight: 550; box-shadow: 0 1px 1px rgba(0,0,0,.04); }
.custom { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12.5px; color: var(--ink2); }
.custom input[type=date], .fgrid select { background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 0 6px; height: 28px; color-scheme: inherit; }
.switch { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--ink2); cursor: pointer; }
.switch input { accent-color: var(--accent); width: 14px; height: 14px; margin: 0; }
details.menu { position: relative; }
details.menu > summary { list-style: none; cursor: pointer; }
details.menu > summary::-webkit-details-marker { display: none; }
details.menu .pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 9; min-width: 260px; background: var(--panel); border: 1px solid var(--line2); border-radius: 8px; padding: 4px; box-shadow: 0 8px 28px rgba(0,0,0,.16); display: grid; gap: 1px; }
details.menu .pop button { text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: 5px; font-size: 13px; display: grid; gap: 1px; }
details.menu .pop button.btn { border: 1px solid var(--line2); }
details.menu .pop button:hover, details.menu .pop button:focus-visible { background: var(--hover); }
details.menu .pop small { color: var(--muted); font-size: 12px; }
details.menu .pop.wide { min-width: 300px; padding: 12px; gap: 10px; }
.fgrid { display: grid; grid-template-columns: auto 1fr; gap: 8px 10px; align-items: center; font-size: 12.5px; color: var(--ink2); }
.fgrid select { min-width: 150px; }
.props { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 2px 0 6px; color: var(--ink2); font-size: 12.5px; }
.props .err { margin: 0; }
.rangetxt b { color: var(--ink); font-weight: 550; }
.fchips { display: flex; gap: 4px; flex-wrap: wrap; }
.fchip { display: inline-flex; gap: 4px; align-items: center; background: var(--soft); color: var(--soft-ink); border: 0; border-radius: 5px; padding: 1px 4px 1px 7px; font-size: 12px; height: 22px; }
.fchip span { font-size: 14px; line-height: 1; opacity: .7; }

/* page head, blocks */
h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; margin: 14px 0 2px; }
h2 { font-size: 14px; font-weight: 600; letter-spacing: -.005em; margin: 0; }
h3 { font-size: 12px; font-weight: 500; color: var(--ink2); margin: 0 0 8px; }
.pagehead { margin: 0 0 14px; }
.pagehead .q { color: var(--ink2); margin-top: 2px; max-width: 80ch; font-size: 13px; }
.pagehead .meta { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.block { margin-top: 22px; }
.block > .bh { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.block > .bh .why { color: var(--muted); font-size: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
.grid { display: grid; gap: 10px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); }
.note { font-size: 12px; color: var(--muted); margin-top: 10px; max-width: 80ch; }
.tag { display: inline-flex; align-items: center; font-size: 11.5px; line-height: 1; height: 20px; padding: 0 6px; border-radius: 5px; background: var(--soft); color: var(--soft-ink); white-space: nowrap; }
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.good { background: var(--good-bg); color: var(--good); }
.scope { display: inline-flex; align-items: center; height: 20px; font-size: 11.5px; color: var(--ink2); padding: 0 7px; border: 1px solid var(--line); border-radius: 5px; background: var(--sunken); }
.banner { margin-top: 10px; padding: 8px 12px; border-radius: 7px; font-size: 12.5px; display: flex; gap: 10px; align-items: flex-start; background: var(--sunken); border: 1px solid var(--line); color: var(--ink2); }
.banner.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.banner b { font-weight: 600; color: var(--ink); }
.banner.warn b { color: inherit; }
.fineprint { font-size: 12px; color: var(--muted); margin: 10px 0 2px; max-width: 90ch; }
.fineprint b { color: var(--ink2); font-weight: 550; }
.pagehead + .props + .fineprint + .chips, .fineprint + .chips { margin-top: 14px; }

/* figures: one bordered strip with hairlines between the cells */
.grid:has(> .kpi) { gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.grid:has(> .kpi) + .grid:has(> .kpi) { margin-top: 10px; }
.kpi.card { border: 0; border-radius: 0; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); padding: 12px 14px; background: transparent; }
.kpi { display: flex; flex-direction: column; gap: 1px; }
.kpi .lab { font-size: 12px; color: var(--ink2); }
.kpi .val { font-size: 24px; font-weight: 600; letter-spacing: -.025em; line-height: 1.2; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); }
.kpi .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
.kpi.low .val { color: var(--muted); }
.kpi .bar2, .kpi .bar { height: 4px; background: var(--hover); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.kpi .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.kpi.low .bar i { background: repeating-linear-gradient(45deg, var(--line2) 0 4px, transparent 4px 7px); }
.dl { display: inline-flex; align-self: flex-start; font-size: 11.5px; margin-top: 4px; padding: 1px 6px; border-radius: 4px; color: var(--muted); background: var(--hover); }
.dl.up { color: var(--good); background: var(--good-bg); } .dl.down { color: var(--bad); background: var(--bad-bg); }

/* lists the way a tracker draws them: one container, rows with hairlines */
.score, .insights { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; margin: 0; padding: 0; list-style: none; display: block; }
.score .r, .insights li { display: grid; align-items: center; gap: 10px; padding: 0 12px; min-height: 36px; border-bottom: 1px solid var(--line); font-size: 13px; }
.score .r { grid-template-columns: 20px minmax(140px, 1.3fr) minmax(90px, auto) minmax(120px, 1fr); }
.insights li { grid-template-columns: 20px 1fr auto; padding-top: 7px; padding-bottom: 7px; }
.score .r:last-child, .insights li:last-child { border-bottom: 0; }
.score .r:hover, .insights li:hover { background: var(--hover); }
.score .r a { color: inherit; text-decoration: none; }
.score .v { font-weight: 600; }
.score .tg { color: var(--muted); font-size: 12px; }
.pill, .insights .ic { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; flex: none; }
.pill.good, .ic.good { background: var(--good-bg); color: var(--good); } .pill.warn, .ic.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); } .pill.na { background: var(--hover); color: var(--muted); } .ic.info { background: var(--soft); color: var(--soft-ink); }
.insights a { color: var(--ink2); white-space: nowrap; font-size: 12px; text-decoration: none; }
.insights a:hover { color: var(--accent); }

/* bars and rows */
.hlist { display: grid; gap: 1px; }
.hrow { display: grid; grid-template-columns: minmax(110px, 34%) 1fr 120px; gap: 10px; align-items: center; padding: 0 8px; margin: 0 -8px; border-radius: 6px; min-height: 28px; }
.hrow:hover, .hrow:focus-visible { background: var(--hover); }
.hrow .nm { overflow-wrap: anywhere; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.hrow .tr { height: 6px; background: var(--hover); border-radius: 3px; position: relative; overflow: hidden; }
.hrow .tr i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; min-width: 2px; }
.hrow .vl { text-align: right; white-space: nowrap; font-weight: 500; }
.hrow .vl small { color: var(--muted); font-size: 12px; margin-left: 6px; font-weight: 400; }
.hrow.low .tr i { background: repeating-linear-gradient(45deg, var(--line2) 0 4px, color-mix(in srgb, var(--line2) 40%, transparent) 4px 7px); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 0 9px; height: 24px; font-size: 12.5px; color: var(--ink2); }
.chip:hover { background: var(--hover); }
.chip[aria-pressed="true"] { background: var(--sel); color: var(--ink); border-color: var(--line2); font-weight: 550; }

/* the feature list */
.frow, .fh2 { display: grid; grid-template-columns: minmax(120px, 28%) 1fr 56px 92px 96px; gap: 10px; align-items: center; }
.frow { padding: 0 8px; margin: 0 -8px; border-radius: 6px; min-height: 34px; cursor: pointer; }
.frow:hover, .frow:focus-visible, .frow[aria-selected="true"] { background: var(--hover); }
.frow[aria-selected="true"] { background: var(--sel); }
.frow .nm { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.frow .tr { height: 6px; background: var(--hover); border-radius: 3px; position: relative; overflow: hidden; }
.frow .tr i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; min-width: 2px; }
.frow.low .tr i { background: repeating-linear-gradient(45deg, var(--line2) 0 4px, color-mix(in srgb, var(--line2) 40%, transparent) 4px 7px); }
.frow.cut .tr i { background: var(--s2); }
.frow .n { text-align: right; font-weight: 500; }
.frow .n small { color: var(--muted); display: block; font-size: 11px; font-weight: 400; }
.fh2 { font-size: 12px; color: var(--muted); padding: 0 8px 6px; margin: 0 -8px 2px; border-bottom: 1px solid var(--line); }
.fh2 span:nth-child(n+3) { text-align: right; }
svg.spark { width: 92px; height: 24px; display: block; overflow: visible; margin-left: auto; }
svg.spark path { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
svg.spark circle { fill: var(--accent); stroke: var(--surface); stroke-width: 2; }
svg.spark .base { stroke: var(--line); stroke-width: 1; }

/* charts: dotted grid, solid marks, quiet labels */
svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
svg.chart text { fill: var(--muted); font: 11px var(--font); }
svg.chart .grid line { stroke: var(--line2); stroke-width: 1; stroke-dasharray: 1 4; stroke-linecap: round; opacity: .9; }
svg.chart .axis { stroke: var(--line2); stroke-width: 1; }
svg.chart .bar { fill: var(--s1); }
svg.chart .bar.part { fill: color-mix(in srgb, var(--s1) 38%, var(--panel)); }
svg.chart .hit { fill: transparent; }
svg.chart g.col:hover .bar, svg.chart g.col:focus-within .bar { filter: brightness(1.1); }
svg.chart .cross { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; opacity: 0; pointer-events: none; }
svg.chart g.col:hover .cross, svg.chart g.col:focus-within .cross { opacity: .6; }
svg.chart .val { fill: var(--ink2); font-weight: 600; }
svg.chart .ln { fill: none; stroke-width: 1.75; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .ln.dash { stroke-dasharray: 4 4; opacity: .7; }
svg.chart .pt { stroke: var(--panel); stroke-width: 2; }
svg.chart .zero { stroke: var(--ink2); stroke-width: 1; opacity: .45; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; color: var(--ink2); }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.sq { height: 8px; width: 8px; border-radius: 2px; }

/* heatmap */
.heat { overflow-x: auto; }
table.hm { border-collapse: separate; border-spacing: 2px; font-size: 12px; min-width: 560px; width: 100%; }
table.hm th { font-weight: 500; color: var(--muted); text-align: center; padding: 2px 4px; white-space: nowrap; }
table.hm th.rw { text-align: left; color: var(--ink2); padding-right: 10px; }
table.hm th.rw small { color: var(--muted); }
table.hm td { height: 28px; text-align: center; border-radius: 4px; min-width: 44px; background: var(--sunken); color: var(--muted); }
table.hm td.c { background: color-mix(in srgb, var(--seq-hi) calc(var(--p) * 100%), var(--seq-lo)); color: var(--ink); }
table.hm td.c.hi { color: var(--on-seq); }
table.hm td.c.low { opacity: .5; }
table.hm td.empty { background: transparent; }

/* tables */
.tbl { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { text-align: right; padding: 0 10px; height: 34px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th:first-child, table.t td:first-child { text-align: left; padding-left: 4px; }
table.t th { color: var(--muted); font-weight: 500; font-size: 12px; }
table.t tbody tr:hover { background: var(--hover); }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t td small { color: var(--muted); }
table.t .best { color: var(--good); font-weight: 600; } table.t .worst { color: var(--bad); font-weight: 600; }
table.t tr.dimmed td { color: var(--muted); }
details.data { margin-top: 10px; font-size: 12.5px; }
details.data summary { cursor: pointer; color: var(--ink2); width: max-content; }
details.data table { border-collapse: collapse; margin-top: 8px; width: 100%; }
details.data th, details.data td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
details.data th { color: var(--muted); font-weight: 500; }
details.data td:not(:first-child), details.data th:not(:first-child) { text-align: right; }
details.data .scroll { overflow-x: auto; }

/* the open feature, the glossary */
.detail { border-color: var(--accent); margin-bottom: 10px; }
.detail .dh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.detail .dh h2 { font-size: 15px; }
.sp { flex: 1; }
dl.gl { display: grid; gap: 14px; margin: 0; }
dl.gl dt { font-weight: 600; }
dl.gl dd { margin: 2px 0 0; color: var(--ink2); max-width: 80ch; }

/* tooltip, gate, states */
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--ink); color: var(--panel); border-radius: 6px; padding: 6px 9px; font-size: 12px; max-width: 300px; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .08s; }
#tip.on { opacity: 1; }
#tip .t { font-weight: 600; display: block; font-size: 12.5px; }
#tip .r { display: block; opacity: .85; }
.toast { position: fixed; right: 16px; bottom: 16px; background: var(--ink); color: var(--panel); padding: 8px 12px; border-radius: 7px; font-size: 12.5px; z-index: 30; }
.gate { max-width: 400px; margin: 14vh auto 0; padding: 22px; }
.gate h1 { margin-top: 0; font-size: 18px; }
.gate form { display: flex; gap: 8px; margin-top: 14px; }
.gate input { flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line2); border-radius: 6px; padding: 0 10px; height: 30px; }
.err { color: var(--bad); background: var(--bad-bg); padding: 6px 10px; border-radius: 6px; margin-top: 10px; font-size: 12.5px; }
.lead { color: var(--ink2); max-width: 70ch; margin-top: 4px; }
.loading main { opacity: .55; transition: opacity .15s; }
footer.foot { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: grid; gap: 4px; max-width: 80ch; }

@media (max-width: 560px) {
  .content { padding: 8px 12px 56px; }
  .topbar { padding: 8px 12px; }
  .hrow { grid-template-columns: 1fr auto; }
  .hrow .tr { grid-column: 1 / -1; order: 3; }
  .fh2 { display: none; }
  .frow { grid-template-columns: 1fr 52px 74px; }
  .frow .tr, .frow .n.u { display: none; }
  .score .r { grid-template-columns: 20px 1fr auto; padding-top: 6px; padding-bottom: 6px; }
  .score .tg { grid-column: 2 / -1; }
  h1 { font-size: 18px; }
  .ctl { margin-left: 0; }
}
@media (forced-colors: active) { .hrow .tr i, .frow .tr i, svg.chart .bar { forced-color-adjust: none; } }
@media print { .side, .topbar, .chips, .btn, .seg, .custom, .switch, details.menu, details.data, #tip, .toast { display: none !important; } body, html { background: #fff; } .app { display: block; height: auto; } .panel { height: auto; overflow: visible; border: 0; margin: 0; } .block, .card { break-inside: avoid; } }
</style>

  [['Установка', 'Install'], ['Один случайный идентификатор, который появляется, когда человек включает отчёты. Это не человек: переустановка или выключение и включение дают новую установку.', 'One random identifier made when someone turns reports on. It is not a person: reinstalling, or switching off and on, makes a new install.']],
  [['Активна в периоде', 'Active in the period'], ['У установки был день активности в периоде или последний отчёт пришёл в нём. День активности — день, когда человек открыл EyeTime или пользовался функцией; фоновый учёт сайтов день активным не делает.', 'The install had a day of activity in the period or its last report came in it. A day of activity is a day the person opened EyeTime or used a feature; background tracking does not make a day active.']],
  [['Установки периода', 'Installs of the period'], ['Сделаны внутри периода. Воронка, активация и удержание следят за ними столько, сколько они существуют: это когорта периода.', 'Made inside the period. The funnel, activation and retention follow them for as long as they exist: the period’s cohort.']],
  [['Возврат D1 / D7 / D30', 'Return D1 / D7 / D30'], ['Доля установок, активных на следующий день (D1), в любой из дней 7–13 (D7) или 30–36 (D30). Окно считается, только когда оно прошло плюс неделя на отчёт; ушедшие — как не вернувшиеся. Окно, а не один день, потому что люди пользуются несколько дней в неделю.', 'The share of installs active the next day (D1), on any of days 7–13 (D7) or 30–36 (D30). A window is counted only when it has passed plus a week for the report; people who left count as not returned. A window and not one day, because people use it a few days a week.']],
  [['Приток к оттоку (quick ratio)', 'Quick ratio'], ['(новые + вернувшиеся) ÷ ушедшие за неделю. Новые — установлены на этой неделе; вернувшиеся — были тихи неделю и дольше; ушедшие — были активны неделей раньше и не активны сейчас. Выше 1 — база растёт.', '(new + returned) ÷ lapsed in a week. New: made this week; returned: quiet for a week or more; lapsed: active the week before and not now. Above 1 the base grows.']],
  [['DAU/MAU (липкость)', 'DAU/MAU (stickiness)'], ['Среднее число активных за день ÷ число активных за 28 дней, по 28 полным дням (последняя неделя ещё не доехала). Показывает, какую часть месяца человек проводит с EyeTime: 20% — примерно 6 дней из 28.', 'Average active per day ÷ active in 28 days, over 28 full days (the last week has not arrived). It shows what part of the month a person spends with EyeTime: 20% is about 6 days of 28.']],
