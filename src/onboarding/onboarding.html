<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="ob.pageTitle">Welcome to EyeTime</title>
  <script src="../ui/theme-init.js"></script>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="../ui/components.css">
  <link rel="stylesheet" href="../ui/looks.css">
  <link rel="stylesheet" href="../ui/appearance.css">
  <link rel="stylesheet" href="onboarding.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="ob-top">
    <div class="brand"><img src="../../icons/logo.svg" alt="" width="28" height="28"><span>EyeTime</span></div>
    <div id="lang"></div>

  <main class="ob">
    <ol class="dots" id="dots" aria-hidden="true"></ol>

    <button class="btn btn-ghost skip" id="skip" type="button" data-i18n="ob.skip">Skip setup</button>
  </main>
  <script type="module" src="onboarding.js"></script>

</html>
