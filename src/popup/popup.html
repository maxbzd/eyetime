<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EyeTime</title>
  <script src="../ui/theme-init.js"></script>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="../ui/components.css">
  <link rel="stylesheet" href="../ui/focus-card.css">
  <link rel="stylesheet" href="../ui/today-card.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="../../icons/logo.svg" alt="" width="26" height="26"><span>EyeTime</span></div>
    <div class="row gap-1">
      <button class="btn btn-ghost btn-sm eye-chip" id="eyeChip" type="button" hidden></button>
      <a class="btn btn-ghost btn-icon btn-sm" id="openInsights" href="../insights/insights.html" target="_blank" data-i18n-attr="aria-label:popup.insights;data-tip:popup.insights"><i data-icon="chart-column"></i></a>
      <a class="btn btn-ghost btn-icon btn-sm" id="openSettings" href="../options/options.html" target="_blank" data-i18n-attr="aria-label:popup.settings;data-tip:popup.settings"><i data-icon="settings"></i></a>
    </div>
  </header>

  <main id="app" class="stack gap-3">
    <section id="focus" class="card"></section>
    <section id="site" class="card"></section>
    <section id="today" class="card"></section>
    <section id="footer" class="stack gap-2"></section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
