<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="nav.settings">Settings</title>
  <script src="../ui/theme-init.js"></script>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="../ui/components.css">
  <link rel="stylesheet" href="../ui/shell.css">
  <link rel="stylesheet" href="../ui/appearance.css">
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <header class="app-header" id="header"></header>
  <div class="settings-layout">
    <aside class="side-wrap" aria-label="Settings" data-i18n-attr="aria-label:nav.settings"><div class="side-search"><i data-icon="search"></i><input class="input" id="q" type="search" autocomplete="off" spellcheck="false" data-i18n-attr="placeholder:opt.search;aria-label:opt.search"></div><div class="side-count" id="qcount" aria-live="polite"></div><nav class="side" id="side" aria-label="Settings sections" data-i18n-attr="aria-label:opt.sections"></nav></aside>
    <main class="settings-main"><h1 class="sr-only" data-i18n="nav.settings">Settings</h1>
      <div class="saved" id="saved" role="status" aria-live="polite"></div>
      <div id="content" class="stack gap-6"></div>
    </main>
  </div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
  <script type="module" src="options.js"></script>
</body>
</html>
