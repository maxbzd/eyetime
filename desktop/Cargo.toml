[workspace]
resolver = "2"
members = ["core", "helper", "app/src-tauri", "installer"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
authors = ["EyeTime"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "unwind"
