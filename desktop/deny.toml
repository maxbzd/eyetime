# cargo-deny: what may be in the dependency tree of the Windows programs. `cargo deny check` runs in CI (desktop.yml).
[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-pc-windows-gnu"] # what is shipped; the Linux build exists only to run the tests of `core` and `helper`

[advisories]
version = 2
yanked = "deny"
# an advisory is not ignored without a reason written next to it:
ignore = [
  # fxhash is "no longer maintained" (a notice, not a vulnerability: a hash function with no known flaw). It comes in through tauri-utils -> kuchikiki -> selectors,
  # which parse the HTML of our own bundled screens at build time. Nothing to replace on our side; look again when Tauri moves off it.
  "RUSTSEC-2025-0057",
]

[licenses]
version = 2
confidence-threshold = 0.9
# our own crates are private (publish = false) and under FSL-1.1-ALv2: this list is about what we depend on
private = { ignore = true }
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # the workspace crates point at each other by path

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
